extends: default.yaml

# Application-facing formal rerun.  The random-IL whole-ion-holdout model is
# the single primary checkpoint that determines reported candidate values and
# decisions. Other split-protocol checkpoints are generated by
# build_protocol_stability_outputs.py, audited by
# build_refactored_application_case.py, and never averaged into the formal
# prediction.
model:
  checkpoint_path: trained_weights/mipgraph_best/weights/split_strategy_comparison_seed42/checkpoints/il_level_random_seed42/best_model.pt
  checkpoint_paths: []
  device: cuda

# The primary applicability domain and ion-support audit must be fitted on the
# exact training partition used by the random-IL checkpoint.
data:
  split_path: il_property_prediction/data/processed/splits/il_level_seed42.json
  training_split_name: train

conditions:
  temperature_start_K: 298.15
  temperature_end_K: 353.15
  temperature_step_K: 5.0
  pressure_kPa: 101.325
  extended_temperature_start_K: 278.15
  extended_temperature_end_K: 373.15
  run_extended_sensitivity: true

uncertainty:
  mode: single_primary_checkpoint
  ensemble_min_checkpoints: 3
  monte_carlo_samples: 1000
  conformal_alpha: 0.05

pareto:
  objectives:
    maximize:
      - conductivity_worst
      - volumetric_heat_capacity_worst
      - thermal_diffusivity_worst
    minimize:
      - viscosity_worst
  final_candidate_min: 3
  final_candidate_max: 8

outputs:
  output_dir: experiments/computational_application_case/outputs_primary_audited
